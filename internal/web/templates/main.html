<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>签到识别</title>
  <style>
    body { margin: 0; background: #f6f7f9; color: #1f2937; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 14px; font-size: 24px; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    select { min-width: 180px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #111827; overflow: hidden; border-radius: 8px; }
    img, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .status { margin-top: 10px; min-height: 22px; color: #374151; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>签到识别</h1>
    <div class="toolbar"><label for="camera">视频源</label><select id="camera"></select></div>
    <div class="stage">
      <img id="stream" alt="摄像头视频流">
      <canvas id="overlay"></canvas>
    </div>
    <div id="status" class="status"></div>
  </main>
  <script>
    const streamImage = document.getElementById('stream');
    const cameraSelect = document.getElementById('camera');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const statusEl = document.getElementById('status');
    let recognizing = false;

    function setStatus(text) { statusEl.textContent = text || ''; }
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadCameras() {
      const res = await fetch('/api/cameras');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '读取摄像头失败');
      const cameras = data.cameras || [];
      cameraSelect.innerHTML = cameras.map(id => '<option value="' + escapeHTML(id) + '">' + escapeHTML(id) + '</option>').join('');
      if (data.default) cameraSelect.value = data.default;
      updateStream();
      if (!cameras.length) {
        setStatus('没有启用的视频源，请检查 config.yaml');
        return;
      }
      loopRecognize();
    }

    function updateStream() {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      const camera = cameraSelect.value;
      streamImage.src = camera ? '/api/cameras/' + encodeURIComponent(camera) + '/stream' : '';
    }

    function resizeOverlay() {
      const width = streamImage.naturalWidth || 640;
      const height = streamImage.naturalHeight || 480;
      if (overlay.width !== width) overlay.width = width;
      if (overlay.height !== height) overlay.height = height;
    }

    async function loopRecognize() {
      const camera = cameraSelect.value;
      if (camera && !recognizing) {
        recognizing = true;
        try {
          const res = await fetch('/api/cameras/' + encodeURIComponent(camera) + '/recognize', { method: 'POST' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || '识别失败');
          drawDetections(data.result);
        } catch (err) {
          setStatus(err.message || '识别失败');
        } finally {
          recognizing = false;
        }
      }
      setTimeout(loopRecognize, 450);
    }

    function drawDetections(result) {
      resizeOverlay();
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      const faces = result && result.faces ? result.faces : [];
      setStatus(faces.length ? '检测到 ' + faces.length + ' 张脸' : '未检测到人脸');
      ctx.lineWidth = 3;
      ctx.font = '18px system-ui, sans-serif';
      for (const face of faces) {
        const box = face.box || {};
        const label = face.name || '未知';
        ctx.strokeStyle = '#22c55e';
        ctx.fillStyle = '#22c55e';
        ctx.strokeRect(box.x || 0, box.y || 0, box.width || 0, box.height || 0);
        const y = Math.max(0, (box.y || 0) - 26);
        const width = ctx.measureText(label).width + 12;
        ctx.fillRect(box.x || 0, y, width, 24);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, (box.x || 0) + 6, y + 18);
      }
    }

    cameraSelect.addEventListener('change', updateStream);
    streamImage.addEventListener('load', resizeOverlay);
    loadCameras().catch(err => setStatus(err.message));
  </script>
</body>
</html>
